name: Unpack CopyReal site

on:
  push:
    paths:
      - 'copyreal_website_v4.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack site package
        run: |
          rm -rf .site-unpack
          mkdir .site-unpack
          unzip -q -o copyreal_website_v4.zip -d .site-unpack
          shopt -s dotglob
          for item in .site-unpack/*; do
            cp -R "$item" ./
          done
          rm -rf .site-unpack

      - name: Commit deployed site files
        run: |
          git config user.name "Copy Real Site Bot"
          git config user.email "copyrealbooks@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "Deploy CopyReal.com V4 site files"
            git push
          fi
