name: Direct store tests
on:
  push:
    branches: [feature/direct-store-integration-preview-2026-10-07]
    paths:
      - 'functions/api/store/**'
      - 'functions/_lib/store.js'
      - 'store/**'
      - 'assets/store.*'
      - 'assets/site.js'
      - '_redirects'
      - '.github/workflows/store-tests.yml'
  pull_request:
    paths:
      - 'functions/api/store/**'
      - 'functions/_lib/store.js'
      - 'store/**'
      - 'assets/store.*'
      - 'assets/site.js'
      - '_redirects'
permissions:
  contents: read
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run store unit, security and migration tests
        run: node --experimental-default-type=module --test store/tests/*.test.mjs
