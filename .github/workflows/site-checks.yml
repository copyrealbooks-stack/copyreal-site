name: Copy Real core site checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  site-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-core-site.mjs
