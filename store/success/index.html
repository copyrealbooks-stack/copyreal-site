<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Your Copy Real purchase</title><link rel="stylesheet" href="../../assets/styles.css"><style>main{max-width:620px;margin:5rem auto;padding:2rem}#download{display:none;padding:.9rem 1rem;background:#d4af37;color:#171717;border-radius:6px;font-weight:700}</style></head><body><main><h1>Thank you for your purchase</h1><p id="message" role="status" aria-live="polite">Verifying your payment securely…</p><p><a id="download" rel="nofollow">Download your purchase</a></p><p><a href="../">Back to the Copy Real store</a></p></main><script>const id=new URLSearchParams(location.search).get("session_id"),msg=document.querySelector("#message"),link=document.querySelector("#download");if(!id){msg.textContent="Missing checkout reference. Please contact Copy Real support."}else{fetch("/api/store/status?session_id="+encodeURIComponent(id),{cache:"no-store"}).then(async response=>{const data=await response.json();if(!response.ok)throw Error(data.error||"Verification failed");if(data.status!=="paid"){msg.textContent="Your payment is processing. Please return shortly.";return}link.href=data.downloadUrl;link.style.display="inline-block";msg.textContent="Payment verified. Your private download is ready. The link is short-lived and the purchase allows up to three download attempts."}).catch(error=>msg.textContent=error.message||"We couldn't verify delivery yet. Keep your receipt and contact Copy Real support.")}</script></body></html>
