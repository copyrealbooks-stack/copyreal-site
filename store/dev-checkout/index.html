<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Copy Real checkout test</title><link rel="stylesheet" href="../../assets/styles.css"><style>main{max-width:670px;margin:5rem auto;padding:2rem}.test-card{border:1px solid #9e8a5f;border-radius:12px;padding:2rem}.test-card button{padding:1rem;border:0;border-radius:6px;background:#b99a50;color:#171717;font-weight:700}.test-card button:disabled{opacity:.45}</style></head><body><main><p><a href="../">← Store preview</a></p><h1>Copy Real checkout test</h1><p>This page is for the development preview only. No real purchases are available here.</p><div class="test-card"><p id="state">Checking whether the sandbox pilot is configured…</p><button id="buy" type="button" disabled>Pay with Stripe's sandbox</button></div></main><script>const state=document.querySelector("#state"),btn=document.querySelector("#buy");fetch("/api/store/catalogue",{cache:"no-store"}).then(async r=>{const data=await r.json();const p=data.products?.find(x=>x.sku==="CR-TEST-EBOOK");if(!data.enabled||!p){state.textContent="The sandbox pilot is not configured; checkout remains disabled.";return}state.textContent=p.name+" — "+new Intl.NumberFormat("en-TH",{style:"currency",currency:p.currency.toUpperCase()}).format(p.amount/100)+" (sandbox only)";btn.disabled=false;btn.addEventListener("click",async()=>{btn.disabled=true;state.textContent="Creating a sandbox checkout…";try{const r=await fetch("/api/store/checkout",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({sku:p.sku})});const result=await r.json();if(!r.ok||!result.checkoutUrl)throw Error(result.error||"Unable to start checkout");location.assign(result.checkoutUrl)}catch(e){state.textContent=e.message;btn.disabled=false}})}).catch(()=>state.textContent="The test store is not available.");</script></body></html>
